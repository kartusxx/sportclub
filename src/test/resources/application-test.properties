# Настройки интеграционных тестов (профиль "test").
# PostgreSQL поднимается через Testcontainers; URL с портом контейнера подставляется в AbstractIntegrationTest.

# Образ PostgreSQL для тестового контейнера
test.postgres.image=postgres:17-alpine
# Имя тестовой базы данных
test.postgres.database=sportclub_test

# Учётные данные: те же значения использует и контейнер, и приложение
spring.datasource.username=sportclub_test
spring.datasource.password=sportclub_test
