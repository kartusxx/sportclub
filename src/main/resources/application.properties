spring.application.name=sportclub
server.port=${SERVER_PORT:8080}

# Database (all values can be overridden via environment variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sportclub}
spring.datasource.username=${DB_USERNAME:sportclub}
spring.datasource.password=${DB_PASSWORD:sportclub}

# JPA: schema is owned by Flyway, Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.flyway.enabled=true

# Pagination: never return more than 50 records per request
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
