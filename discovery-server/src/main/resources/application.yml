spring:
  application:
    name: discovery-server

server:
  port: ${SERVER_PORT:8761}

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    # одиночный сервер: не регистрируется сам в себе и не тянет реестр у «соседей»
    register-with-eureka: false
    fetch-registry: false
  server:
    # для разработки: упавший сервис исчезает из реестра быстро (удобно показывать Circuit Breaker)
    enable-self-preservation: false
    # без кэша ответов: новые регистрации видны сразу, а не через 30 с (иначе сервисы не находят друг друга после старта)
    use-read-only-response-cache: false
    response-cache-update-interval-ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info