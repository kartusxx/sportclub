# Общие настройки для ВСЕХ клиентов Config Server.
# ${...} подставляются на стороне клиента из его переменных среды.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true