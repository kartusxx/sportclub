# Общие настройки для ВСЕХ клиентов Config Server.
# ${...} подставляются на стороне клиента из его переменных среды.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5   # клиенты быстрее узнают о новых сервисах (по умолчанию 30 с)
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

spring:
  cloud:
    loadbalancer:
      cache:
        ttl: 5s                          # кэш экземпляров балансировщика (по умолчанию 35 с)
    openfeign:
      circuitbreaker:
        enabled: true            # каждый Feign-клиент оборачивается в Resilience4j Circuit Breaker
      client:
        config:
          default:
            connectTimeout: 1000   # мс на установку соединения
            readTimeout: 2000      # мс на ожидание ответа
            loggerLevel: basic

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10                 # окно из последних 10 вызовов
        minimumNumberOfCalls: 5               # раньше 5 вызовов процент сбоев не считается
        failureRateThreshold: 50              # >= 50% сбоев в окне — цепь размыкается
        waitDurationInOpenState: 10s          # столько цепь остаётся разомкнутой
        permittedNumberOfCallsInHalfOpenState: 3   # пробные вызовы в полуоткрытом состоянии
        automaticTransitionFromOpenToHalfOpenEnabled: true
        ignoreExceptions:                     # ответы 4xx (404, 409...) — не сбой сервиса
          - feign.FeignException$FeignClientException
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s                   # общий бюджет на вызов, включая повтор
        cancelRunningFuture: true
