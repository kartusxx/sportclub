# Общие настройки для всех сервисов (Config Server отдаёт этот файл каждому клиенту)
spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000   # мс на установку соединения
            readTimeout: 5000      # мс на ожидание ответа
            loggerLevel: basic
