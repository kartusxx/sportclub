server:
  port: ${SERVER_PORT:8080}

info:
  service: booking-service

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/booking_db}
    username: ${DB_USERNAME:booking}
    password: ${DB_PASSWORD:booking}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true