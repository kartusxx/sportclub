# Настройки booking-service
server:
  port: ${SERVER_PORT:8080}

info:
  service: booking-service

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/booking_db}
    username: ${DB_USERNAME:booking}
    password: ${DB_PASSWORD:booking}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50   # нельзя отдавать больше 50 записей за запрос
