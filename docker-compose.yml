# Весь стенд: docker compose up --build
# Наружу опубликованы только gateway (8081) и Eureka (8761, для демонстрации).
# Остальные сервисы и все БД доступны только во внутренней сети compose.
# Порты для отладки: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Настройки берутся из переменных окружения / файла .env (шаблон: .env.example).

x-postgres: &postgres
  image: postgres:17-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 5s
    retries: 10

# Общие переменные клиентов Config Server / Eureka
x-client-env: &client-env
  CONFIG_URL: http://config-server:8888
  EUREKA_URL: http://discovery-server:8761/eureka/

# Клиенты стартуют после config-server и discovery-server
x-client-depends: &client-depends
  config-server:
    condition: service_healthy
  discovery-server:
    condition: service_healthy

# Проверка здоровья через Actuator (в образе есть wget из busybox)
x-healthcheck: &healthcheck
  test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 40s

services:
  # ---------- базы данных (по одной на сервис) ----------
  member-db:
    <<: *postgres
    container_name: sportclub-member-db
    environment:
      POSTGRES_DB: member_db
      POSTGRES_USER: member
      POSTGRES_PASSWORD: ${MEMBER_DB_PASSWORD:-member}
    volumes:
      - member-db-data:/var/lib/postgresql/data

  catalog-db:
    <<: *postgres
    container_name: sportclub-catalog-db
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog}
    volumes:
      - catalog-db-data:/var/lib/postgresql/data

  booking-db:
    <<: *postgres
    container_name: sportclub-booking-db
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD:-booking}
    volumes:
      - booking-db-data:/var/lib/postgresql/data

  # ---------- инфраструктура ----------
  config-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: config-server
    container_name: sportclub-config-server
    restart: unless-stopped
    environment:
      SERVER_PORT: 8888
      CONFIG_REPO_PATH: file:/config-repo
    volumes:
      - ./config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  discovery-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: discovery-server
    container_name: sportclub-discovery-server
    restart: unless-stopped
    environment:
      SERVER_PORT: 8761
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------- бизнес-сервисы ----------
  member-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: member-service
    container_name: sportclub-member-service
    restart: unless-stopped
    environment:
      <<: *client-env
      DB_URL: jdbc:postgresql://member-db:5432/member_db
      DB_USERNAME: member
      DB_PASSWORD: ${MEMBER_DB_PASSWORD:-member}
    depends_on:
      <<: *client-depends
      member-db:
        condition: service_healthy
    healthcheck: *healthcheck

  catalog-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: catalog-service
    container_name: sportclub-catalog-service
    restart: unless-stopped
    environment:
      <<: *client-env
      R2DBC_URL: r2dbc:postgresql://catalog-db:5432/catalog_db
      DB_URL: jdbc:postgresql://catalog-db:5432/catalog_db   # JDBC нужен только Flyway
      DB_USERNAME: catalog
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog}
    depends_on:
      <<: *client-depends
      catalog-db:
        condition: service_healthy
    healthcheck: *healthcheck

  booking-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: booking-service
    container_name: sportclub-booking-service
    restart: unless-stopped
    environment:
      <<: *client-env
      DB_URL: jdbc:postgresql://booking-db:5432/booking_db
      DB_USERNAME: booking
      DB_PASSWORD: ${BOOKING_DB_PASSWORD:-booking}
    depends_on:
      <<: *client-depends
      booking-db:
        condition: service_healthy
    healthcheck: *healthcheck

  # ---------- точка входа ----------
  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: api-gateway
    container_name: sportclub-api-gateway
    restart: unless-stopped
    environment: *client-env
    depends_on:
      <<: *client-depends
      member-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8081}:8080"
    healthcheck: *healthcheck

volumes:
  member-db-data:
  catalog-db-data:
  booking-db-data:
