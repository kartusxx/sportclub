x-postgres: &postgres
  image: postgres:17-alpine
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 5s
    retries: 10

x-client-env: &client-env
  CONFIG_URL: http://config-server:8888
  EUREKA_URL: http://discovery-server:8761/eureka/

x-client-depends: &client-depends
  config-server:
    condition: service_healthy
  discovery-server:
    condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    container_name: sportclub-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sportclub}
      POSTGRES_USER: ${POSTGRES_USER:-sportclub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sportclub}
    volumes:
      - sportclub-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: monolith
    container_name: sportclub-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-sportclub}
      DB_USERNAME: ${POSTGRES_USER:-sportclub}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sportclub}
    ports:
      - "${APP_PORT:-8080}:8080"

  member-db:
    <<: *postgres
    container_name: sportclub-member-db
    environment:
      POSTGRES_DB: member_db
      POSTGRES_USER: member
      POSTGRES_PASSWORD: ${MEMBER_DB_PASSWORD:-member}
    volumes:
      - member-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"

  catalog-db:
    <<: *postgres
    container_name: sportclub-catalog-db
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog}
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"

  booking-db:
    <<: *postgres
    container_name: sportclub-booking-db
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD:-booking}
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"

  config-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: config-server
    container_name: sportclub-config-server
    environment:
      SERVER_PORT: 8888
      CONFIG_REPO_PATH: file:/config-repo
    volumes:
      - ./config-repo:/config-repo:ro
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  discovery-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: discovery-server
    container_name: sportclub-discovery-server
    environment:
      SERVER_PORT: 8761
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  member-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: member-service
    container_name: sportclub-member-service
    environment:
      <<: *client-env
      DB_URL: jdbc:postgresql://member-db:5432/member_db
      DB_USERNAME: member
      DB_PASSWORD: ${MEMBER_DB_PASSWORD:-member}
    depends_on:
      <<: *client-depends
      member-db:
        condition: service_healthy

  catalog-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: catalog-service
    container_name: sportclub-catalog-service
    environment:
      <<: *client-env
      R2DBC_URL: r2dbc:postgresql://catalog-db:5432/catalog_db
      DB_URL: jdbc:postgresql://catalog-db:5432/catalog_db
      DB_USERNAME: catalog
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog}
    depends_on:
      <<: *client-depends
      catalog-db:
        condition: service_healthy

  booking-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: booking-service
    container_name: sportclub-booking-service
    environment:
      <<: *client-env
      DB_URL: jdbc:postgresql://booking-db:5432/booking_db
      DB_USERNAME: booking
      DB_PASSWORD: ${BOOKING_DB_PASSWORD:-booking}
    depends_on:
      <<: *client-depends
      booking-db:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: api-gateway
    container_name: sportclub-api-gateway
    environment: *client-env
    depends_on: *client-depends
    ports:
      - "${GATEWAY_PORT:-8081}:8080"

volumes:
  sportclub-db-data:
  member-db-data:
  catalog-db-data:
  booking-db-data: