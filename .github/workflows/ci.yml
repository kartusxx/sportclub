name: CI

on:
  push:
  pull_request:

jobs:
  # Сборка, тесты и проверка покрытия (JaCoCo, минимум 70 % по строкам) отдельно по каждому модулю.
  # Testcontainers использует Docker, который есть на runner'е ubuntu-latest.
  verify:
    name: verify (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - config-server
          - discovery-server
          - api-gateway
          - member-service
          - catalog-service
          - booking-service
          - monolith   # удалим вместе с модулем на последнем шаге
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, test and check coverage
        run: ./mvnw -B -pl ${{ matrix.module }} -am verify
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.module }}
          path: ${{ matrix.module }}/target/site/jacoco
          if-no-files-found: ignore

  # Сквозной smoke-тест всего стенда: участник → тариф → абонемент → занятие → запись
  e2e:
    name: e2e (docker compose)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test through the gateway
        run: bash scripts/smoke-test.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down -v
