services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sportclub
      POSTGRES_USER: sportclub
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportclub -d sportclub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
